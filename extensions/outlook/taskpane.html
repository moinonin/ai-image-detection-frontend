<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VeriForensic Email Verifier</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      body { font: 14px/1.5 "Segoe UI", sans-serif; padding: 16px; color: #161616; }
      .pill { padding: 8px; border-left: 4px solid #8d8d8d; }
      .verified { border-color: #198038; }
      .unverified { border-color: #da1e28; }
      .meta { margin-top: 8px; white-space: pre-line; }
      label { display: block; margin-top: 18px; }
      input { box-sizing: border-box; width: 100%; padding: 8px; }
      button { margin-top: 10px; padding: 8px 12px; }
    </style>
  </head>
  <body>
    <div class="pill" id="status">Ready</div>
    <div class="meta" id="meta"></div>
    <button id="verify" type="button">Verify message</button>
    <label for="apiBase">VeriForensic API</label>
    <input id="apiBase" type="url" />
    <button id="save" type="button">Save</button>
    <span id="saved"></span>
    <script src="taskpane.js"></script>
  </body>
</html>
